<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://kit.fontawesome.com/64d58efce2.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/src/styles/styles.css" />
  <title>Recuperar Senha - Enade.Quiz</title>
</head>
<body>
  <div class="container">
    <div class="forms-container">
      <div class="signin-signup">
        <!-- Formulário esqueceu senha -->
        <form id="forgotPasswordForm">
          <div class="tilte-logo">
            <h2 class="title">Recuperar senha</h2>
            <h4 class="sub-title"></h4>
          </div>
          <div class="input-field">
            <i class="fas fa-envelope"></i>
            <input type="email" id="forgotEmail" placeholder="Email" maxlength="50" required />
            <small class="error-message" id="emailError"></small>
          </div>
          <input type="submit" value="Enviar" class="btn solid" />
          <a href="/index.html">Voltar</a>
          <img src="/src/img/logonassau.png" alt="nassau" class="imgLogo">
        </form>
      </div>
    </div>

    <div class="panels-container">
      <div class="panel left-panel">
        <img src="/src/img/avatar2.png" class="image" alt="" />
      </div>
      <div class="panel right-panel">
      </div>
    </div>
  </div>

  <script type = "module" src="/src/javascript/app2.js" defer></script>
</body>
</html>

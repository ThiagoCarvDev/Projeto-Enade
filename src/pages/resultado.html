<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultados - Enade Quiz</title>
  <link rel="stylesheet" href="/src/styles/resultado.css"> <!-- Link para o arquivo CSS -->
</head>
<body>
  <h1>Resultado do Quiz</h1>

  <div class="resumo">
    <h3>Resumo do Quiz</h3>
    <p>Acertos: <span id="acertos"></span></p>
    <p>Erros: <span id="erros"></span></p>
    <p>Porcentagem de Acertos: <span id="percentual"></span>%</p>
  </div>

  <div class="resultados">
    <!-- As perguntas com as respostas corretas/incorretas serão inseridas aqui pelo JavaScript -->
  </div>

  <script src="/src/javascript/resultado.js"></script> <!-- Link para o JavaScript -->
</body>
</html>

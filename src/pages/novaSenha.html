<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://kit.fontawesome.com/64d58efce2.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/src/styles/styles.css" />
  <title>Recuperar Senha - Enade.Quiz</title>
</head>
<body>
  <div class="container">
    <div class="forms-container">
      <div class="signin-signup">
        <!-- Formulário para redefinir senha -->
        <form id="reset-password-form">
          <div class="tilte-logo">
            <h2 class="title">Definir Nova Senha</h2>
          </div>
          <div class="input-field">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="Digite sua nova senha" required />
          </div>
          <div class="input-field">
            <i class="fas fa-lock"></i>
            <input type="password" id="confirmPassword" placeholder="Confirme sua senha" required />
          </div>
          <input type="submit" value="Enviar" class="btn solid" />
          <img src="/src/img/logonassau.png" alt="nassau" class="imgLogo">
        </form>
      </div>
    </div>

    <div class="panels-container">
      <div class="panel left-panel">
        <img src="/src/img/avatar1.png" class="image" alt="" />
      </div>
      <div class="panel right-panel">
      </div>
    </div>
  </div>

  <script type = "module" src="../javascript/app3.js" defer></script>
</body>
</html>
